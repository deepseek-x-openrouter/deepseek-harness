# DeepSeek Harness in one container: password-gated web UI, workspace preview,
# Codex subscription as the model route.
#
#   cd docker && cp .env.example .env && edit .env && docker compose up -d --build
#
# Everything the deployment needs is in .env; nothing here has to be edited.
name: dsh

services:
  dsh:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # Stamps the client build with the commit it was built from.
        DSH_CLIENT_COMMIT_HASH: ${DSH_CLIENT_COMMIT_HASH:-0000000}
        # Who the container runs as. It gets its own account (10001) rather
        # than uid 1000, which on most hosts is a real person; set these to
        # your own ids only to match a bind-mounted workspace you own.
        UID: ${UID:-10001}
        GID: ${GID:-10001}
    image: dsh-preview:latest
    restart: unless-stopped
    init: true
    environment:
      # The password gate on the front door. Both are required reading in
      # .env; the container refuses to start without a password.
      WEB_USER: ${WEB_USER:-dsh}
      WEB_PASSWORD: ${WEB_PASSWORD:?set WEB_PASSWORD in docker/.env}
      # Every authority a browser may reach this deployment by, comma
      # separated (host or host:port) — the harness API fence refuses pages
      # served under any other name.
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost:${WEB_PORT:-8080}}
      TRUST_REMOTE_CONFIG: ${TRUST_REMOTE_CONFIG:-1}
      # The model the first start writes into settings.yaml; signing in
      # happens inside the container (`docker compose exec dsh dsh-login`).
      CODEX_MODEL: ${CODEX_MODEL:-gpt-5.3-codex-spark}
      # A GitHub token for `gh` and for git pushes over HTTPS. Passed in from
      # the environment (or .env) rather than stored: the container exchanges
      # it for gh's own credential store on start and then drops the variable.
      GH_TOKEN: ${GH_TOKEN:-}
    # A database for the agent to read: put libpq's own variables (PGHOST,
    # PGUSER, …) in docker/db.env and `psql`, psycopg and DuckDB's postgres
    # extension all connect with no arguments. The file is optional, and it is
    # a file rather than .env entries because libpq rejects an empty value for
    # some of its variables — only what you write there is ever set.
    env_file:
      - path: db.env
        required: false
    ports:
      # Bound to loopback by default: publish it wider only behind TLS.
      - "${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    volumes:
      # The harness home: sessions, settings, credentials, the profile.
      - dsh-home:/data
      # What the agent works on. Point WORKSPACE_DIR at a host directory to
      # edit real files; the default keeps everything inside Docker.
      - ${WORKSPACE_DIR:-dsh-workspace}:/workspace

volumes:
  dsh-home:
  dsh-workspace:
